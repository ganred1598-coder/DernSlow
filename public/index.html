<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DERNSLOW Cloudflare</title><style>body{font-family:system-ui;background:#111;color:#fff;margin:0;padding:24px}main{max-width:720px;margin:auto}.card{background:#1d1d1d;border:1px solid #333;border-radius:16px;padding:18px;margin:14px 0}button{background:#f5c400;border:0;border-radius:10px;padding:12px 16px;font-weight:800}.ok{color:#71e49b}.error{color:#ff9b9b}</style></head><body><main><h1>DERNSLOW OS Cloudflare</h1><div class="card"><p>Migration foundation พร้อมทดสอบ API ในเครื่อง</p><button onclick="health()">ตรวจระบบ</button><pre id="result"></pre></div></main><script>async function health(){const box=document.getElementById('result');box.textContent='กำลังตรวจ...';try{const r=await fetch('/api/health');const d=await r.json();box.className=d.ok?'ok':'error';box.textContent=JSON.stringify(d,null,2)}catch(e){box.className='error';box.textContent=e.message}}</script></body></html>
