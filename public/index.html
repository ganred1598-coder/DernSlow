<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c0c0c"><title>DERNSLOW</title>
<style>
:root{--gold:#f5c400;--bg:#0c0c0c;--panel:#181818;--line:#303030;--muted:#aaa;--danger:#ff8585;--ok:#70e39b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}header{position:sticky;top:0;z-index:20;background:#0c0c0cf0;backdrop-filter:blur(12px);border-bottom:1px solid #222}.top{max-width:1120px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:12px}.brand{font-weight:950;font-size:22px}.brand span{color:var(--gold)}.spacer{flex:1}button{border:0;border-radius:12px;padding:11px 15px;font-weight:850;cursor:pointer}.gold{background:var(--gold);color:#111}.dark{background:#252525;color:#fff;border:1px solid #3b3b3b}.cart-button{position:relative}.badge{position:absolute;right:-7px;top:-7px;background:#e94747;color:#fff;border-radius:99px;min-width:22px;height:22px;padding:2px 6px;font-size:12px}main{max-width:1120px;margin:auto;padding:22px 18px 100px}.hero{padding:28px 0 20px}.hero h1{font-size:clamp(30px,6vw,62px);line-height:1;margin:0 0 10px}.hero p,.meta{color:var(--muted)}.status{margin-top:14px;font-size:13px;color:var(--ok)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:15px}.product{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}.photo{height:170px;background:linear-gradient(135deg,#252525,#111);display:grid;place-items:center;color:#555;font-size:46px;background-size:cover;background-position:center}.product-body{padding:15px;display:flex;flex-direction:column;gap:9px;flex:1}.product h3{margin:0;font-size:17px}.stock{color:var(--ok);font-size:13px}.stock.out{color:var(--danger)}.prices{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto}.size{background:#262626;color:#fff;border:1px solid #414141;padding:8px 10px;border-radius:10px;font-size:13px}.empty,.loading{grid-column:1/-1;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:25px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;z-index:50;background:#000c;display:grid;place-items:center;padding:14px}.hidden{display:none!important}.sheet{width:min(680px,100%);max-height:92vh;overflow:auto;background:#151515;border:1px solid #383838;border-radius:20px;padding:20px}.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}.sheet-head h2{margin:0}.close{margin-left:auto;background:#2a2a2a;color:#fff;width:40px;height:40px;padding:0;font-size:22px}.cart-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #2c2c2c}.remove{background:#351d1d;color:#ffaaaa;padding:7px 10px}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:900;padding:16px 0}.notice{background:#222;border:1px solid #383838;border-radius:12px;padding:11px;margin:10px 0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;color:#ddd;font-size:13px;margin:10px 0}input,textarea,select{width:100%;margin-top:6px;border:1px solid #414141;border-radius:11px;background:#0f0f0f;color:#fff;padding:12px}.account{display:flex;gap:10px;border:1px solid #3a3a3a;border-radius:12px;padding:12px;margin:8px 0}.account:has(input:checked){border-color:var(--gold)}.account input{width:20px;margin:0}.error-box{background:#381919;border:1px solid #a83b3b;color:#ffd0d0;border-radius:12px;padding:13px;margin:12px 0}.error-box strong{display:block;color:var(--danger);margin-bottom:4px}.full{width:100%}.success{border:1px solid #5c4b00;background:#252006;border-radius:16px;padding:18px;text-align:center}.order-no{font-size:28px;color:var(--gold);font-weight:950;margin:8px}.countdown{font-weight:900;color:var(--gold)}.order-card{border:1px solid #383838;border-radius:14px;padding:14px;margin:10px 0}.row{display:flex;justify-content:space-between;gap:10px}.pill{background:#282828;border-radius:99px;padding:4px 8px;font-size:12px}.upload{margin-top:14px;border-top:1px solid #333;padding-top:14px}@media(max-width:600px){.top{padding:11px}.brand{font-size:18px}.top button{padding:9px 10px}.form-grid{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr;gap:9px}.photo{height:125px}.product-body{padding:11px}.product h3{font-size:14px}.size{font-size:12px;padding:7px}}
</style></head><body>
<header><div class="top"><div class="brand">DERN<span>SLOW</span></div><div class="spacer"></div><button class="dark" onclick="openOrders()">ออเดอร์ของฉัน</button><button class="gold cart-button" onclick="openCart()">ตะกร้า <span id="cartBadge" class="badge">0</span></button></div></header>
<main><section class="hero"><h1>DERNSLOW STORE</h1><p>เลือกสินค้าและยืนยันการจอง ระบบกันสต็อกให้อัตโนมัติ</p><div id="systemStatus" class="status">กำลังเชื่อมต่อระบบ…</div></section><section id="products" class="grid"><div class="loading">กำลังโหลดสินค้า…</div></section></main>
<div id="cartModal" class="modal hidden"><div class="sheet"><div class="sheet-head"><h2>ตะกร้าสินค้า</h2><button class="close" onclick="closeModal('cartModal')">×</button></div><div id="cartItems"></div><div class="total"><span>ยอดรวม</span><span><span id="cartTotal">0</span> บาท</span></div><div class="notice">สินค้าจะถูกสำรองหลังสร้างออเดอร์</div><div class="form-grid"><label>ชื่อลูกค้า<input id="customerName" autocomplete="name"></label><label>เบอร์โทร<input id="customerPhone" inputmode="tel" autocomplete="tel" placeholder="0812345678 หรือ +66812345678"></label></div><label>ที่อยู่จัดส่ง<textarea id="customerAddress" rows="3"></textarea></label><label>วิธีชำระเงิน<select id="paymentMethod" onchange="renderAccounts()"><option value="prepaid">ชำระก่อนจัดส่ง</option><option value="cod">เก็บเงินปลายทาง</option></select></label><div id="accounts"></div><div id="orderError" class="error-box hidden" role="alert" aria-live="assertive"></div><button id="submitButton" class="gold full" onclick="submitOrder()">ยืนยันการจองสินค้า</button></div></div>
<div id="successModal" class="modal hidden"><div class="sheet"><div class="sheet-head"><h2>ออเดอร์ของคุณ</h2><button class="close" onclick="closeModal('successModal')">×</button></div><div id="successBody"></div></div></div>
<div id="ordersModal" class="modal hidden"><div class="sheet"><div class="sheet-head"><h2>ออเดอร์ของฉัน</h2><button class="close" onclick="closeModal('ordersModal')">×</button></div><div id="ordersBody"></div></div></div>
<script>
const state={products:[],accounts:[],reservationMinutes:40,cart:JSON.parse(localStorage.getItem('ds_cf_cart')||'[]'),submitting:false,pendingRequestId:sessionStorage.getItem('ds_pending_order')||''};
const customerKey=(()=>{let k=localStorage.getItem('ds_customer_key');if(!k){k='ds_'+crypto.randomUUID().replaceAll('-','');localStorage.setItem('ds_customer_key',k)}return k})();
const money=v=>new Intl.NumberFormat('th-TH').format(Number(v||0));const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function imageOf(p){try{return JSON.parse(p.images_json||'[]')[0]||''}catch{return''}}function pricesOf(p){return[1,5,10,30,50,100,500,1000].map(q=>({q,price:Number(p['price_'+q])})).filter(x=>Number.isFinite(x.price)&&x.price>=0&&x.q<=Number(p.stock_units))}
async function api(path,options={}){const r=await fetch(path,options);let d;try{d=await r.json()}catch{throw Error('ระบบตอบกลับไม่ถูกต้อง')}if(!r.ok||!d.ok)throw Error(d?.error?.message||'เชื่อมต่อระบบไม่สำเร็จ');return d}
function persist(){localStorage.setItem('ds_cf_cart',JSON.stringify(state.cart));document.getElementById('cartBadge').textContent=state.cart.length}function closeModal(id){document.getElementById(id).classList.add('hidden')}function openModal(id){document.querySelectorAll('.modal').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
function add(productId,quantity){const p=state.products.find(x=>x.id===productId);if(!p)return;if(state.cart.some(x=>x.product_id===productId&&x.quantity===quantity))return alert('มีขนาดนี้ในตะกร้าแล้ว');state.cart.push({product_id:productId,quantity,name:p.name,price:Number(p['price_'+quantity]),unit:p.unit_name});persist();openCart()}function removeItem(i){state.cart.splice(i,1);persist();renderCart()}
function renderProducts(){const box=document.getElementById('products');if(!state.products.length){box.innerHTML='<div class="empty">ยังไม่มีสินค้าที่พร้อมขาย</div>';return}box.innerHTML=state.products.map(p=>{const image=imageOf(p),prices=pricesOf(p),out=Number(p.stock_units)<=0;return `<article class="product"><div class="photo" ${image?`style="background-image:url('${esc(image)}')"`:''}>${image?'':'◆'}</div><div class="product-body"><h3>${esc(p.name)}</h3><div class="meta">${esc(p.category||'สินค้า')} • ${esc(p.code)}</div><div class="stock ${out?'out':''}">${out?'สินค้าหมด':'เหลือ '+money(p.stock_units)+' '+esc(p.unit_name||'หน่วย')}</div><div class="prices">${prices.map(x=>`<button class="size" onclick="add('${esc(p.id)}',${x.q})">${x.q} ${esc(p.unit_name||'')} • ${money(x.price)}฿</button>`).join('')||'<span class="meta">ยังไม่มีราคาที่พร้อมขาย</span>'}</div></div></article>`}).join('')}
function renderCart(){document.getElementById('cartItems').innerHTML=state.cart.length?state.cart.map((x,i)=>`<div class="cart-row"><div><b>${esc(x.name)}</b><br><small>${x.quantity} ${esc(x.unit)}</small></div><b>${money(x.price)}฿</b><button class="remove" onclick="removeItem(${i})">ลบ</button></div>`).join(''):'<div class="empty">ตะกร้าว่าง</div>';document.getElementById('cartTotal').textContent=money(state.cart.reduce((s,x)=>s+Number(x.price),0));renderAccounts()}function openCart(){renderCart();clearError();openModal('cartModal')}
function renderAccounts(){const method=document.getElementById('paymentMethod').value,box=document.getElementById('accounts');if(method==='cod'){box.innerHTML='<div class="notice">ชำระเงินเมื่อได้รับสินค้า</div>';return}if(!state.accounts.length){box.innerHTML='<div class="error-box">ร้านยังไม่มีบัญชีรับชำระที่เปิดใช้งาน</div>';return}box.innerHTML=state.accounts.map((a,i)=>`<label class="account"><input type="radio" name="account" value="${esc(a.id)}" ${i===0?'checked':''}><span><b>${esc(a.provider||a.type)}</b><br>${esc(a.account_number||'')}<br><small>${esc(a.account_name||'')}</small></span></label>`).join('')}
function normalizePhone(v){let d=String(v||'').replace(/\D/g,'');if(d.startsWith('0066'))d=d.slice(4);if(d.startsWith('66')&&d.length>=11)d=d.slice(2);if(d.length===9)d='0'+d;return d}function showError(message){const b=document.getElementById('orderError');b.innerHTML='<strong>บันทึกการจองไม่สำเร็จ</strong>'+esc(message);b.classList.remove('hidden');b.scrollIntoView({behavior:'smooth',block:'center'})}function clearError(){const b=document.getElementById('orderError');b.classList.add('hidden');b.textContent=''}
async function submitOrder(){if(state.submitting)return;clearError();const button=document.getElementById('submitButton');try{if(!state.cart.length)throw Error('ตะกร้าว่าง');const name=document.getElementById('customerName').value.trim(),phone=normalizePhone(document.getElementById('customerPhone').value),address=document.getElementById('customerAddress').value.trim(),method=document.getElementById('paymentMethod').value,account=document.querySelector('input[name="account"]:checked')?.value||'';if(!name)throw Error('กรุณากรอกชื่อลูกค้า');if(!/^0[1-9][0-9]{8}$/.test(phone))throw Error('เบอร์โทรไม่ถูกต้อง กรุณากรอกเบอร์ไทย 10 หลัก');if(!address)throw Error('กรุณากรอกที่อยู่จัดส่ง');if(method==='prepaid'&&!account)throw Error('กรุณาเลือกบัญชีรับชำระ');document.getElementById('customerPhone').value=phone;state.submitting=true;button.disabled=true;button.textContent='กำลังสร้างออเดอร์…';if(!state.pendingRequestId){state.pendingRequestId='order_'+crypto.randomUUID().replaceAll('-','');sessionStorage.setItem('ds_pending_order',state.pendingRequestId)}const d=await api('/api/orders',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({request_id:state.pendingRequestId,customer_key:customerKey,customer_name:name,phone,address,payment_method:method,payment_account_id:account,items:state.cart.map(x=>({product_id:x.product_id,quantity:x.quantity}))})});state.pendingRequestId='';sessionStorage.removeItem('ds_pending_order');state.cart=[];persist();closeModal('cartModal');showSuccess(d,method,account);await loadProducts()}catch(e){showError(e.message||String(e))}finally{state.submitting=false;button.disabled=false;button.textContent='ยืนยันการจองสินค้า'}}
function showSuccess(o,method,accountId){const a=state.accounts.find(x=>x.id===accountId),until=new Date(o.reserved_until);document.getElementById('successBody').innerHTML=`<div class="success"><div>สร้างออเดอร์เรียบร้อย</div><div class="order-no">${esc(o.order_no)}</div><div>ยอดรวม <b>${money(o.total)} บาท</b></div><p>${method==='prepaid'?'ชำระภายใน <span class="countdown" id="countdown"></span>':'เก็บเงินปลายทาง'}</p>${method==='prepaid'&&a?`<div class="notice"><b>${esc(a.provider)}</b><br>${esc(a.account_number)}<br>${esc(a.account_name)}</div><div class="upload"><label>แนบสลิป<input id="slipFile" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"></label><button class="gold full" onclick="uploadSlip('${esc(o.order_id)}')">ส่งสลิป</button><div id="slipStatus"></div></div>`:''}</div>`;openModal('successModal');if(method==='prepaid'){const tick=()=>{const el=document.getElementById('countdown');if(!el)return;const sec=Math.max(0,Math.floor((until-Date.now())/1000));el.textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');if(sec)setTimeout(tick,1000)};tick()}}
async function uploadSlip(id){const file=document.getElementById('slipFile')?.files?.[0],s=document.getElementById('slipStatus');try{if(!file)throw Error('กรุณาเลือกไฟล์สลิป');s.textContent='กำลังส่งสลิป…';const f=new FormData();f.append('file',file);await api('/api/orders/'+encodeURIComponent(id)+'/slip',{method:'POST',body:f});s.className='status';s.textContent='ส่งสลิปเรียบร้อย กำลังรอตรวจสอบ'}catch(e){s.className='error-box';s.textContent=e.message}}
async function openOrders(){openModal('ordersModal');const b=document.getElementById('ordersBody');b.innerHTML='<div class="loading">กำลังโหลด…</div>';try{const d=await api('/api/orders?customer_key='+encodeURIComponent(customerKey));b.innerHTML=d.orders.length?d.orders.map(o=>`<div class="order-card"><div class="row"><b>${esc(o.order_no)}</b><span class="pill">${esc(o.status)}</span></div><div class="row"><span>${new Date(o.created_at).toLocaleString('th-TH')}</span><b>${money(o.total)}฿</b></div><div class="meta">ชำระเงิน: ${esc(o.payment_status)} • ${esc(o.payment_method)}</div></div>`).join(''):'<div class="empty">ยังไม่มีออเดอร์</div>'}catch(e){b.innerHTML='<div class="error-box">'+esc(e.message)+'</div>'}}
async function loadProducts(){const d=await api('/api/products');state.products=d.products;renderProducts()}async function init(){persist();try{const [c]=await Promise.all([api('/api/config'),loadProducts()]);state.accounts=c.payment_accounts||[];state.reservationMinutes=c.reservation_minutes||40;document.getElementById('systemStatus').textContent='ระบบ Cloudflare พร้อมใช้งาน • สำรอง '+state.reservationMinutes+' นาที'}catch(e){const s=document.getElementById('systemStatus');s.style.color='var(--danger)';s.textContent='เปิดร้านไม่สำเร็จ: '+e.message;document.getElementById('products').innerHTML='<div class="error-box">'+esc(e.message)+'</div>'}}init();
</script></body></html>
