<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DERNSLOW | ศูนย์ข้อมูล</title><style>:root{--y:#f5c400;--b:#0c0c0c;--p:#181818;--m:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--b);color:#fff;font-family:system-ui}button,input,a{font:inherit}button,.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800;text-decoration:none;text-align:center;cursor:pointer}.yellow{background:var(--y);color:#111}.dark{background:#252525;color:#fff;border:1px solid #444}header{position:sticky;top:0;z-index:20;background:#0c0c0cf2;border-bottom:1px solid #222}.top,main{max-width:1100px;margin:auto}.top{padding:14px 18px;display:flex;align-items:center;gap:12px}.brand{font-size:22px;font-weight:950}.brand span{color:var(--y)}.grow{flex:1}main{padding:28px 18px 90px}.hero{padding:22px 0}.hero h1{font-size:clamp(34px,6vw,62px);margin:8px 0}.meta,.hero p{color:var(--m)}#status{color:#70e39b;font-size:13px;margin-top:16px}.tools{display:grid;grid-template-columns:1fr auto;gap:10px;margin:16px 0}.search{background:#111;border:1px solid #444;border-radius:12px;color:#fff;padding:12px}.cats{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.chip{white-space:nowrap;background:#222;color:#ddd;border:1px solid #444}.chip.on{background:var(--y);color:#111}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.card{background:var(--p);border:1px solid #333;border-radius:18px;overflow:hidden;display:flex;flex-direction:column}.photo{height:175px;background:#222 center/cover;display:grid;place-items:center}.body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}.body h2{font-size:18px;margin:0}.desc{color:#ccc;font-size:14px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}.empty{grid-column:1/-1;padding:24px;text-align:center;background:var(--p);border-radius:14px}.modal{position:fixed;inset:0;z-index:50;background:#000c;display:grid;place-items:center;padding:14px}.hide{display:none}.sheet{width:min(700px,100%);max-height:92vh;overflow:auto;background:#151515;border:1px solid #444;border-radius:20px;padding:20px}.head{display:flex}.head h2{margin:0}.close{margin-left:auto;background:#292929;color:#fff}.detail-img{width:100%;max-height:350px;object-fit:cover;border-radius:14px;margin-top:14px}.opts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.opt{background:#222;border:1px solid #444;border-radius:10px;padding:9px}.note{background:#15281b;border:1px solid #285f38;border-radius:12px;padding:12px;margin:14px 0}.full{display:block;width:100%}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr;gap:8px}.photo{height:125px}.body{padding:10px}.desc{display:none}.actions,.tools{grid-template-columns:1fr}}</style></head><body><header><div class="top"><div class="brand">DERN<span>SLOW</span></div><div class="grow"></div><a id="topLine" class="btn yellow" target="_blank">คุยกับแอดมิน LINE</a></div></header><main><section class="hero"><div class="meta">PRODUCT INFORMATION</div><h1>ศูนย์ข้อมูล DERNSLOW</h1><p>ดูรายละเอียดตามหมวดหมู่ หากสนใจให้สอบถามและสั่งผ่านแอดมินใน LINE Official Account</p><a id="heroLine" class="btn yellow" target="_blank">เปิดแชต @highdernslow</a><div id="status">กำลังเชื่อมต่อข้อมูล…</div></section><div class="tools"><input id="search" class="search" type="search" placeholder="ค้นหาชื่อ รหัส หรือหมวดหมู่" oninput="render()"><button class="dark" onclick="resetAll()">ล้าง</button></div><nav id="cats" class="cats"></nav><section id="products" class="grid"><div class="empty">กำลังโหลด…</div></section></main><div id="modal" class="modal hide"><div class="sheet"><div class="head"><h2 id="title"></h2><button class="close" onclick="closeDetail()">×</button></div><div id="detail"></div></div></div><script>const S={products:[],cat:'ทั้งหมด',lineId:'@highdernslow'},E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),M=v=>new Intl.NumberFormat('th-TH').format(Number(v||0));async function api(p){const r=await fetch(p),d=await r.json();if(!r.ok||!d.ok)throw Error(d?.error?.message||'เชื่อมต่อไม่ได้');return d}function img(p){try{return JSON.parse(p.images_json||'[]')[0]||''}catch{return''}}function line(m='สวัสดีครับ/ค่ะ ต้องการสอบถามข้อมูลจากเว็บไซต์ DERNSLOW'){return`https://line.me/R/oaMessage/${encodeURIComponent(S.lineId)}/?${encodeURIComponent(m)}`}function sync(){topLine.href=heroLine.href=line();heroLine.textContent='เปิดแชต '+S.lineId}function drawCats(){cats.innerHTML=['ทั้งหมด',...new Set(S.products.map(p=>p.category||'อื่นๆ'))].map(c=>`<button class="chip ${c===S.cat?'on':''}" onclick="pick('${E(c)}')">${E(c)}</button>`).join('')}function pick(c){S.cat=c;drawCats();render()}function resetAll(){S.cat='ทั้งหมด';search.value='';drawCats();render()}function render(){const q=search.value.toLowerCase(),a=S.products.filter(p=>(S.cat==='ทั้งหมด'||(p.category||'อื่นๆ')===S.cat)&&(!q||[p.name,p.code,p.category,p.description].join(' ').toLowerCase().includes(q)));products.innerHTML=a.length?a.map(p=>{const i=img(p);return`<article class="card"><div class="photo" ${i?`style="background-image:url('${E(i)}')"`:''}>${i?'':'◆'}</div><div class="body"><h2>${E(p.name)}</h2><div class="meta">${E(p.category||'ทั่วไป')} • ${E(p.code)}</div><div class="desc">${E(p.description||'ดูรายละเอียดและสอบถามแอดมิน')}</div><div class="actions"><button class="dark" onclick="openDetail('${E(p.id)}')">รายละเอียด</button><a class="btn yellow" href="${E(line('สนใจสอบถาม '+p.name+' รหัส '+p.code))}" target="_blank">ถามแอดมิน</a></div></div></article>`}).join(''):'<div class="empty">ไม่พบข้อมูล</div>'}function openDetail(id){const p=S.products.find(x=>x.id===id),i=img(p),o=[1,5,10,30,50,100,500,1000].map(q=>({q,v:Number(p['price_'+q])})).filter(x=>Number.isFinite(x.v)&&x.v>=0),msg=`สนใจสอบถาม ${p.name}\nรหัส ${p.code}\nกรุณาแนะนำรายละเอียดและวิธีสั่งผ่านแอดมิน`;title.textContent=p.name;detail.innerHTML=`${i?`<img class="detail-img" src="${E(i)}">`:''}<p class="meta">${E(p.category||'ทั่วไป')} • ${E(p.code)}</p><p>${E(p.description||'กรุณาสอบถามรายละเอียดกับแอดมิน')}</p>${o.length?`<div class="opts">${o.map(x=>`<span class="opt">${x.q} ${E(p.unit_name||'')} • ${M(x.v)} บาท</span>`).join('')}</div>`:''}<div class="note">การตรวจสอบสถานะและการสั่งดำเนินการโดยแอดมินใน LINE OA</div><a class="btn yellow full" href="${E(line(msg))}" target="_blank">เปิด LINE คุยกับแอดมิน</a>`;modal.classList.remove('hide')}function closeDetail(){modal.classList.add('hide')}modal.onclick=e=>{if(e.target===modal)closeDetail()};async function init(){try{const[c,p]=await Promise.all([api('/api/config'),api('/api/products')]);S.lineId=c.line_oa_id||'@highdernslow';S.products=p.products||[];sync();drawCats();render();status.textContent='ข้อมูลพร้อม • ติดต่อ '+S.lineId+' เพื่อสั่งผ่านแอดมิน'}catch(e){status.textContent='เปิดข้อมูลไม่สำเร็จ: '+e.message}}sync();init();</script></body></html>
