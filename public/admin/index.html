<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DERNSLOW Admin</title>
<style>
:root{--yellow:#f5c400;--bg:#0b0b0b;--panel:#181818;--muted:#aaa;--green:#70e39b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,sans-serif}header{border-bottom:1px solid #292929;background:#101010}.bar,main{max-width:980px;margin:auto}.bar{display:flex;align-items:center;gap:12px;padding:16px 18px}.brand{font-size:22px;font-weight:950}.brand span{color:var(--yellow)}.grow{flex:1}a{color:inherit}.back{padding:9px 12px;border:1px solid #444;border-radius:10px;text-decoration:none}main{padding:30px 18px}.eyebrow{color:var(--yellow);font-weight:800}.hero h1{font-size:clamp(32px,6vw,54px);margin:8px 0}.hero p{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}.card{background:var(--panel);border:1px solid #333;border-radius:18px;padding:18px}.label{color:var(--muted);font-size:14px}.value{font-size:28px;font-weight:900;margin-top:8px}.ok{color:var(--green)}.notice{margin-top:18px;padding:16px;border-radius:14px;background:#15281b;border:1px solid #285f38}.error{background:#351717;border-color:#743232}.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{background:var(--yellow);color:#111;padding:11px 14px;border-radius:11px;font-weight:800;text-decoration:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.value{font-size:24px}}
</style>
</head>
<body>
<header><div class="bar"><div class="brand">DERN<span>SLOW</span> ADMIN</div><div class="grow"></div><a class="back" href="/">หน้าเว็บหลัก</a></div></header>
<main>
<section class="hero"><div class="eyebrow">SYSTEM CONTROL CENTER</div><h1>ศูนย์ควบคุมระบบ</h1><p>ตรวจสอบสถานะระบบ Cloudflare และข้อมูลรายการที่เผยแพร่บนเว็บไซต์</p></section>
<section class="grid"><div class="card"><div class="label">สถานะระบบ</div><div id="health" class="value">กำลังตรวจ…</div></div><div class="card"><div class="label">รายการข้อมูล</div><div id="count" class="value">—</div></div><div class="card"><div class="label">ช่องทางติดต่อ</div><div id="line" class="value">—</div></div></section>
<div id="notice" class="notice">กำลังโหลดข้อมูลระบบ…</div>
<div class="links"><a class="btn" href="/">ดูหน้าศูนย์ข้อมูล</a></div>
</main>
<script>
async function get(path){const r=await fetch(path,{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d?.error?.message||'เชื่อมต่อไม่ได้');return d}
async function init(){try{const[h,p,c]=await Promise.all([get('/api/health'),get('/api/products'),get('/api/config')]);health.textContent='ออนไลน์';health.className='value ok';count.textContent=(p.products||[]).length+' รายการ';line.textContent=c.line_oa_id||'—';notice.textContent='ระบบพร้อมใช้งาน ข้อมูลสำคัญของร้านไม่ได้แสดงในหน้านี้'}catch(e){health.textContent='ตรวจไม่สำเร็จ';notice.textContent='เกิดข้อผิดพลาด: '+e.message;notice.className='notice error'}}init();
</script>
</body>
</html>
